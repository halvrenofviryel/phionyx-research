name: Claim-Language Gate

# Lints every registered artefact's LIVE README against portfolio.yaml (the public
# claim registry). Runs on pushes touching the registry/linter, weekly (sibling repos
# drift without touching this repo), and on demand.

on:
  push:
    paths:
      - portfolio.yaml
      - tools/claim_lint.py
      - README.md
      - .github/workflows/claim-lint.yml
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Self-test the gate, then lint all registered READMEs
        run: python tools/claim_lint.py
